<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STELLAR PROTOCOL · LOADING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }

        #scene-container {
            position: fixed; inset: 0;
            z-index: 1;
        }

        /* 加载信息 */
        #loading-info {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.8s;
        }
        #loading-info.hidden { opacity: 0; }

        .loading-title {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(0, 243, 255, 0.5);
            margin-bottom: 12px;
        }

        .loader-ring-wrap {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-bottom: 16px;
        }
        .loader-dot {
            width: 4px; height: 4px;
            background: var(--dot-color, rgba(0,243,255,0.3));
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 2px), calc(100% - 2px) 100%, 0 100%);
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .loader-dot:nth-child(1) { --dot-color: rgba(0,243,255,0.2); animation-delay: 0s; }
        .loader-dot:nth-child(2) { --dot-color: rgba(0,243,255,0.3); animation-delay: 0.1s; }
        .loader-dot:nth-child(3) { --dot-color: rgba(0,243,255,0.5); animation-delay: 0.2s; }
        .loader-dot:nth-child(4) { --dot-color: rgba(0,243,255,0.6); animation-delay: 0.3s; }
        .loader-dot:nth-child(5) { --dot-color: rgba(0,243,255,0.8); animation-delay: 0.4s; }
        .loader-dot:nth-child(6) { --dot-color: rgba(0,243,255,0.6); animation-delay: 0.5s; }
        .loader-dot:nth-child(7) { --dot-color: rgba(0,243,255,0.5); animation-delay: 0.6s; }
        .loader-dot:nth-child(8) { --dot-color: rgba(0,243,255,0.3); animation-delay: 0.7s; }
        .loader-dot:nth-child(9) { --dot-color: rgba(0,243,255,0.2); animation-delay: 0.8s; }
        @keyframes dotPulse {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(2.5); }
        }

        .loading-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: rgba(0, 243, 255, 0.6);
            letter-spacing: 2px;
        }

        /* 引导线 */
        #guide-line {
            position: fixed;
            top: 50%; left: 50%;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--fui-cyan), transparent);
            transform-origin: left center;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            --fui-cyan: #00f3ff;
        }
        #guide-line.active {
            opacity: 1;
        }
        #guide-line::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -5px;
            width: 10px; height: 10px;
            background: #fff;
            box-shadow: 0 0 10px var(--fui-cyan), 0 0 20px var(--fui-cyan);
            border-radius: 50%;
        }

        /* ENTER 按钮 */
        #enter-btn {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s, transform 0.8s;
            transform: translate(-50%, -50%) scale(0.8);
        }
        #enter-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        #enter-btn button {
            background: transparent;
            border: 1px solid rgba(0,243,255,0.4);
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            letter-spacing: 8px;
            padding: 18px 48px;
            cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            background: rgba(0,243,255,0.05);
        }
        #enter-btn button::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,243,255,0.15), rgba(0,243,255,0.3));
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #enter-btn button:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 30px rgba(0,243,255,0.3), inset 0 0 20px rgba(0,243,255,0.05);
        }
        #enter-btn button:hover::before { width: 100%; }
        #enter-btn .enter-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.4;
            margin-top: 12px;
            text-align: center;
            color: rgba(0,243,255,0.6);
        }
    </style>
</head>
<body>

<div id="scene-container"></div>

<div id="loading-info">
    <div class="loading-title">✦ INITIALIZING STELLAR PROTOCOL</div>
    <div class="loader-ring-wrap">
        <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
        <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
        <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
    </div>
    <div class="loading-status" id="loadStatus">CONNECTING TO DEEP SPACE NETWORK...</div>
</div>

<div id="guide-line"></div>

<div id="enter-btn">
    <button id="enterBtn">ENTER</button>
    <div class="enter-sub">ACCESS STELLAR NAVIGATION SYSTEM</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === 场景 ===
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 2, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('scene-container').appendChild(renderer.domElement);

// === 星空 ===
const starsGeo = new THREE.BufferGeometry();
const starCount = 8000;
const pos = new Float32Array(starCount * 3);
const cols = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
    const r = 200 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const c = 0.5 + Math.random() * 0.5;
    cols[i*3] = c; cols[i*3+1] = c; cols[i*3+2] = c + Math.random() * 0.3;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
starsGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
    size: 0.8, vertexColors: true, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(stars);

// === 黑洞核心 ===
const coreGeo = new THREE.SphereGeometry(1.2, 64, 64);
const coreMat = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x1a0533) },
    },
    vertexShader: `
        varying vec3 vNormal; varying vec2 vUv;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform float uTime;
        uniform vec3 uColor;
        varying vec3 vNormal;
        varying vec2 vUv;
        void main() {
            float rim = 1.0 - abs(dot(vNormal, vec3(0, 0, 1)));
            rim = pow(rim, 3.0);
            float swirl = sin(vUv.x * 20.0 + vUv.y * 10.0 + uTime * 0.5) * 0.5 + 0.5;
            vec3 col = mix(uColor, vec3(0.4, 0.1, 0.8), rim * 0.8);
            col += vec3(0.6, 0.2, 1.0) * rim * 0.6;
            col += vec3(0.8, 0.4, 1.0) * swirl * 0.05;
            gl_FragColor = vec4(col, 1.0);
        }
    `,
});
const blackHole = new THREE.Mesh(coreGeo, coreMat);
scene.add(blackHole);

// === 吸积盘（粒子环） ===
const diskParticles = 15000;
const diskGeo = new THREE.BufferGeometry();
const diskPos = new Float32Array(diskParticles * 3);
const diskSizes = new Float32Array(diskParticles);
const diskColors = new Float32Array(diskParticles * 3);
for (let i = 0; i < diskParticles; i++) {
    const radius = 1.5 + Math.random() * 3.5;
    const angle = Math.random() * Math.PI * 2;
    const height = (Math.random() - 0.5) * 0.3 * (1 - (radius - 1.5) / 3.5);
    diskPos[i*3] = Math.cos(angle) * radius;
    diskPos[i*3+1] = height;
    diskPos[i*3+2] = Math.sin(angle) * radius;
    diskSizes[i] = Math.random() * 3 + 1;
    const t = (radius - 1.5) / 3.5;
    diskColors[i*3] = 0.8 - t * 0.5;
    diskColors[i*3+1] = 0.3 - t * 0.2;
    diskColors[i*3+2] = 1.0 - t * 0.3;
}
diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
diskGeo.setAttribute('size', new THREE.BufferAttribute(diskSizes, 1));
diskGeo.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));

const diskMat = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uTexture: { value: (() => {
            const c = document.createElement('canvas');
            c.width = 32; c.height = 32;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(16,16,0,16,16,16);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            g.addColorStop(0.5, 'rgba(200,180,255,0.4)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g; ctx.fillRect(0,0,32,32);
            return new THREE.CanvasTexture(c);
        })() },
    },
    vertexShader: `
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        uniform float uTime;
        void main() {
            vColor = color;
            vec3 pos = position;
            float r = length(pos.xz);
            float angle = atan(pos.z, pos.x) + uTime * (0.3 / r);
            pos.x = cos(angle) * r;
            pos.z = sin(angle) * r;
            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = size * (80.0 / -mvPos.z);
            gl_Position = projectionMatrix * mvPos;
        }
    `,
    fragmentShader: `
        uniform sampler2D uTexture;
        varying vec3 vColor;
        void main() {
            vec4 tex = texture2D(uTexture, gl_PointCoord);
            if (tex.a < 0.01) discard;
            gl_FragColor = vec4(vColor * 1.2, tex.a * 0.7);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const disk = new THREE.Points(diskGeo, diskMat);
scene.add(disk);

// === 内环发光 ===
const glowRing = new THREE.Mesh(
    new THREE.RingGeometry(1.3, 1.8, 64),
    new THREE.MeshBasicMaterial({
        color: 0x8844ff,
        transparent: true,
        opacity: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    })
);
glowRing.rotation.x = Math.PI / 2;
scene.add(glowRing);

// === 光线（黑洞后面的垂直线状光芒） ===
const rayCount = 60;
const rayGeo = new THREE.BufferGeometry();
const rayPos = new Float32Array(rayCount * 6);
for (let i = 0; i < rayCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 1.2 + Math.random() * 0.3;
    const len = 2 + Math.random() * 6;
    rayPos[i*6] = Math.cos(a) * r;
    rayPos[i*6+1] = Math.sin(a) * r * 0.3;
    rayPos[i*6+2] = Math.sin(a) * r * 0.3;
    rayPos[i*6+3] = Math.cos(a) * r * 2;
    rayPos[i*6+4] = Math.sin(a) * len;
    rayPos[i*6+5] = Math.sin(a) * r * 0.5;
}
rayGeo.setAttribute('position', new THREE.BufferAttribute(rayPos, 3));
const rayMat = new THREE.LineBasicMaterial({
    color: 0x6644aa,
    transparent: true,
    opacity: 0.08,
    blending: THREE.AdditiveBlending,
});
const rays = new THREE.LineSegments(rayGeo, rayMat);
scene.add(rays);

// === 加载进度环 ===
const progressRing = new THREE.Mesh(
    new THREE.RingGeometry(2.6, 2.7, 64),
    new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.4,
        side: THREE.DoubleSide,
        depthWrite: false,
    })
);
progressRing.rotation.x = Math.PI / 2;
progressRing.rotation.z = Math.PI / 4;
scene.add(progressRing);

const progressArc = new THREE.Mesh(
    new THREE.RingGeometry(2.6, 2.7, 64, 1, 0, Math.PI * 0.01),
    new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    })
);
progressArc.rotation.x = Math.PI / 2;
progressArc.rotation.z = Math.PI / 4;
scene.add(progressArc);
// 更新弧度函数
function setProgress(pct) {
    const angle = Math.PI * 2 * Math.min(pct, 1);
    progressArc.geometry.dispose();
    progressArc.geometry = new THREE.RingGeometry(2.6, 2.7, 64, 1, 0, angle);
    progressArc.rotation.x = Math.PI / 2;
    progressArc.rotation.z = Math.PI / 4;
    progressRing.material.opacity = 0.2 + pct * 0.3;
}

// === 引导线 ===
const guideLineEl = document.getElementById('guide-line');
const loadStatus = document.getElementById('loadStatus');
const loadingInfo = document.getElementById('loading-info');
const enterBtn = document.getElementById('enter-btn');

// === 加载模拟 ===
const statuses = [
    { pct: 5,  text: 'INITIALIZING DEEP SPACE PROTOCOL...' },
    { pct: 15, text: 'CONNECTING TO STELLAR NETWORK...' },
    { pct: 30, text: 'LOADING STAR CHARTS...' },
    { pct: 45, text: 'CALIBRATING NAVIGATION SYSTEMS...' },
    { pct: 60, text: 'SYNCHRONIZING TTS MODULE...' },
    { pct: 75, text: 'ESTABLISHING QUANTUM CHANNEL...' },
    { pct: 88, text: 'FINALIZING SYSTEM INTEGRATION...' },
    { pct: 95, text: 'ALIGNING SPACETIME COORDINATES...' },
    { pct: 100, text: '✦ PROTOCOL COMPLETE' },
];

let progress = 0;
let statusIdx = 0;
let isComplete = false;

function simulateLoading() {
    if (isComplete) return;
    progress += 0.3 + Math.random() * 0.7;
    if (progress > 100) progress = 100;

    setProgress(progress / 100);
    diskMat.uniforms.uTime.value += 0.02 * (0.5 + progress / 100);

    if (statusIdx < statuses.length && progress >= statuses[statusIdx].pct) {
        loadStatus.textContent = statuses[statusIdx].text;
        statusIdx++;
    }

    if (progress >= 100) {
        isComplete = true;
        onLoadComplete();
        return;
    }

    setTimeout(simulateLoading, 200 + Math.random() * 400);
}

function onLoadComplete() {
    // 隐藏加载信息
    loadingInfo.classList.add('hidden');

    // 展开引导线
    setTimeout(() => {
        guideLineEl.classList.add('active');
        guideLineEl.style.transition = 'width 1.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s';
        guideLineEl.style.width = '80px';

        setTimeout(() => {
            // 方向向右
            guideLineEl.style.transform = 'rotate(0deg)';

            setTimeout(() => {
                // 显示 ENTER 按钮
                enterBtn.classList.add('visible');

                // 引导线淡出
                setTimeout(() => {
                    guideLineEl.style.opacity = '0';
                }, 500);
            }, 600);
        }, 500);
    }, 400);
}

// === ENTER 按钮 ===
document.getElementById('enterBtn').addEventListener('click', () => {
    // 闪白过渡
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;z-index:999;background:#fff;opacity:0;transition:opacity 0.3s;pointer-events:none;';
    document.body.appendChild(flash);
    requestAnimationFrame(() => { flash.style.opacity = '1'; });
    setTimeout(() => {
        window.location.href = '../index.html';
    }, 400);
});

// === 动画渲染 ===
let time = 0;
function animate() {
    requestAnimationFrame(animate);
    time += 0.005;

    // 黑洞旋转
    blackHole.rotation.y += 0.003;
    blackHole.rotation.x += 0.001;

    // 更新 uniform
    coreMat.uniforms.uTime.value = time;
    diskMat.uniforms.uTime.value = time * 2;
    glowRing.rotation.z += 0.005;
    rays.rotation.y += 0.002;

    // 内环脉冲
    glowRing.material.opacity = 0.12 + Math.sin(time * 2) * 0.05;

    // 星星微动
    stars.rotation.y += 0.0001;

    renderer.render(scene, camera);
}
animate();

// === 响应式 ===
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动加载
setTimeout(simulateLoading, 800);
</script>
</body>
</html>

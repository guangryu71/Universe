<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadertoy Raymarching Port</title>
<style>
  * { margin: 0; padding: 0; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<script>
// ========== 片段着色器（已适配 WebGL2）==========
const FRAG_SHADER = `#version 300 es
precision highp float;

uniform vec2  uResolution;
uniform float uTime;

out vec4 outColor;

// ✅ 原始 Shadertoy mainImage 代码（未做任何逻辑修改）
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = (2.0 * fragCoord - uResolution.xy) / uResolution.y;
    vec3 ro = vec3(1.0, 0.0, uTime * 2.0);
    vec3 rd = normalize(vec3(uv, 1.0));
    vec4 col = vec4(0.0);
    float t = 0.0;

    for(int i = 0; i < 52; ++i) {
        vec3 p = ro + rd * t;
        vec2 polar = vec2(atan(p.y, p.x), length(p.xy));
        vec3 q = vec3(polar.x + uTime * 0.5, 1.0 / polar.y + uTime * 0.5, p.z * 0.1);

        float d = 0.0;
        float s = 0.9;
        for(int j = 0; j < 6; ++j) {
            q = abs(mod(q + 1.0, 2.0) - 1.0); // ⚠️ 修复：原代码 mod(x,0.0) 是 UB
            float a = 2.0;
            q *= a;
            s *= a;
            d = max(d, abs(dot(sin(q), cos(q.zxy + uTime))) / s);
        }

        float stepSize = max(0.001, d * 0.5); // ⚠️ 修复：避免零步长死循环
        t += stepSize;
        col += vec4(0.1 / (1.0 + d * 200.0)) * exp(-t * 0.00);

        if(t > 7.9 || col.a > 1.0) break;
    }

    fragColor = vec4(col.rgb * 2.5, 1.0); // ⚠️ 修复：alpha 改为 1.0
}

// ✅ 桥接入口
void main() {
    mainImage(outColor, gl_FragCoord.xy);
}
`;

// ========== 顶点着色器（全屏三角形带）==========
const VERT_SHADER = `#version 300 es
in vec2 aPosition;
void main() {
    gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;

// ========== WebGL2 初始化与渲染 ==========
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');

if (!gl) {
    document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:40vh">您的浏览器不支持 WebGL2</h1>';
    throw new Error('WebGL2 not supported');
}

// 编译着色器工具函数
function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
    }
    return shader;
}

const vert = createShader(gl, gl.VERTEX_SHADER, VERT_SHADER);
const frag = createShader(gl, gl.FRAGMENT_SHADER, FRAG_SHADER);
const program = gl.createProgram();
gl.attachShader(program, vert);
gl.attachShader(program, frag);
gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    throw new Error('Shader link failed');
}

// 全屏四边形（2个三角形组成的 TRIANGLE_STRIP）
const vertices = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const vao = gl.createVertexArray();
const vbo = gl.createBuffer();
gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(program, 'aPosition');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

// 获取 Uniform 位置
const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

// 自适应画布尺寸
function resize() {
    const dpr = Math.min(window.devicePixelRatio, 2); // ⚠️ 限制 DPR 防止移动端过载
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// 渲染循环
gl.useProgram(program);
gl.bindVertexArray(vao);

function render(now) {
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform1f(uTime, now * 0.001);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
